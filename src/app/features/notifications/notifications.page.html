<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Notifications</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="markAllAsRead()" *ngIf="notifications.length > 0">
        Mark All Read
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Loading State -->
  <app-skeleton-loader *ngIf="loading"></app-skeleton-loader>

  <!-- Error State -->
  <app-error-state 
    *ngIf="error" 
    message="Failed to load notifications. Please try again."
    (retry)="loadData()">
  </app-error-state>

  <!-- Empty State -->
  <app-empty-state 
    *ngIf="!loading && !error && notifications.length === 0"
    icon="notifications-off-outline"
    title="No notifications yet"
    message="You're all caught up! New notifications will appear here.">
  </app-empty-state>

  <!-- Content -->
  <div class="notifications-list" *ngIf="!loading && !error && notifications.length > 0">
    <div 
      class="notification-item" 
      *ngFor="let item of notifications"
      [class.unread]="!item.is_read"
      (click)="handleTap(item)"
    >
      <div class="notification-item__icon" [ngClass]="getIconClass(item.type)">
        <!-- simple CSS circle or ion-icon depending on Ionic setup -->
      </div>
      
      <div class="notification-item__content">
        <div class="notification-item__header">
          <h3 class="notification-item__title">{{ item.title }}</h3>
          <span class="notification-item__time">{{ getTimeAgo(item.created_at) }}</span>
        </div>
        <p class="notification-item__message">{{ item.message }}</p>
      </div>

      <div class="notification-item__dot" *ngIf="!item.is_read"></div>
    </div>
  </div>
</ion-content>
