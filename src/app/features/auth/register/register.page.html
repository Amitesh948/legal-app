<div class="auth-card">
  <!-- Branding -->
  <div class="auth-card__header">
    <div class="auth-logo">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
        <rect width="44" height="44" rx="10" fill="var(--color-primary)"/>
        <path d="M12 12h6v20h-6V12zm14 6h6v14h-6V18z" fill="white"/>
      </svg>
    </div>
    <h1 *ngIf="currentStep === 'role'">Create account</h1>
    <h1 *ngIf="currentStep === 'otp-request'">Verify your email</h1>
    <h1 *ngIf="currentStep === 'otp-verify'">Enter OTP</h1>
    <h1 *ngIf="currentStep === 'details'">Your details</h1>
    <p *ngIf="currentStep === 'role'">Choose your account type to get started</p>
    <p *ngIf="currentStep === 'otp-request'">We'll send a verification code to your email</p>
    <p *ngIf="currentStep === 'otp-verify'">Enter the code sent to {{ email }}</p>
    <p *ngIf="currentStep === 'details'">Complete your {{ selectedRole }} profile</p>
  </div>

  <!-- Step Indicator -->
  <div class="step-indicator" *ngIf="currentStep !== 'role'">
    <div class="step-indicator__bar">
      <div class="step-indicator__progress"
           [style.width]="currentStep === 'otp-request' ? '33%' : currentStep === 'otp-verify' ? '66%' : '100%'">
      </div>
    </div>
  </div>

  <!-- Error Message -->
  <div class="auth-error" *ngIf="errorMessage">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="15" y1="9" x2="9" y2="15"/>
      <line x1="9" y1="9" x2="15" y2="15"/>
    </svg>
    <span>{{ errorMessage }}</span>
  </div>

  <!-- Success Message -->
  <div class="auth-success" *ngIf="successMessage">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span>{{ successMessage }}</span>
  </div>

  <!-- STEP 1: Role Selection -->
  <div *ngIf="currentStep === 'role'" class="role-selection">
    <button class="role-card" (click)="selectRole('client')">
      <div class="role-card__icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-secondary)" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="role-card__info">
        <h3>Client</h3>
        <p>Get legal consultation and manage your cases</p>
      </div>
      <svg class="role-card__arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <button class="role-card" (click)="selectRole('advocate')">
      <div class="role-card__icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </svg>
      </div>
      <div class="role-card__info">
        <h3>Advocate</h3>
        <p>Manage assigned cases and draft legal opinions</p>
      </div>
      <svg class="role-card__arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>

  <!-- STEP 2: OTP Request -->
  <form *ngIf="currentStep === 'otp-request'" (ngSubmit)="requestOtp()" novalidate>
    <div class="form-field">
      <label for="reg-email">Email address</label>
      <ion-input
        id="reg-email"
        type="email"
        placeholder="Enter your email"
        [(ngModel)]="email"
        name="email"
        autocomplete="email"
        inputmode="email"
        [disabled]="loading"
      ></ion-input>
    </div>

    <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="loading">
      <span class="spinner spinner-sm" *ngIf="loading"></span>
      <span *ngIf="!loading">Send Verification Code</span>
      <span *ngIf="loading">Sending...</span>
    </button>

    <button type="button" class="btn btn-ghost btn-block mt-3" (click)="goBack()">
      Back
    </button>
  </form>

  <!-- STEP 3: OTP Verify -->
  <form *ngIf="currentStep === 'otp-verify'" (ngSubmit)="verifyOtp()" novalidate>
    <div class="form-field">
      <label for="otp-code">Verification Code</label>
      <ion-input
        id="otp-code"
        type="text"
        placeholder="Enter 6-digit code"
        [(ngModel)]="otpCode"
        name="otpCode"
        inputmode="numeric"
        [disabled]="loading"
      ></ion-input>
    </div>

    <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="loading">
      <span class="spinner spinner-sm" *ngIf="loading"></span>
      <span *ngIf="!loading">Verify Code</span>
      <span *ngIf="loading">Verifying...</span>
    </button>

    <button type="button" class="btn btn-ghost btn-block mt-3" (click)="goBack()">
      Back
    </button>
  </form>

  <!-- STEP 4: Details Form -->
  <form *ngIf="currentStep === 'details'" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-row">
      <div class="form-field">
        <label for="firstName">First name</label>
        <ion-input
          id="firstName"
          type="text"
          placeholder="First name"
          [(ngModel)]="firstName"
          name="firstName"
          [disabled]="loading"
        ></ion-input>
      </div>

      <div class="form-field">
        <label for="lastName">Last name</label>
        <ion-input
          id="lastName"
          type="text"
          placeholder="Last name"
          [(ngModel)]="lastName"
          name="lastName"
          [disabled]="loading"
        ></ion-input>
      </div>
    </div>

    <div class="form-field">
      <label for="reg-phone">Phone number</label>
      <ion-input
        id="reg-phone"
        type="tel"
        placeholder="Enter your phone number"
        [(ngModel)]="phone"
        name="phone"
        inputmode="tel"
        [disabled]="loading"
      ></ion-input>
    </div>

    <div class="form-field">
      <label for="reg-address">Address</label>
      <ion-input
        id="reg-address"
        type="text"
        placeholder="Enter your address"
        [(ngModel)]="address"
        name="address"
        [disabled]="loading"
      ></ion-input>
    </div>

    <div class="form-field">
      <label for="reg-password">Password</label>
      <ion-input
        id="reg-password"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Create a password"
        [(ngModel)]="password"
        name="password"
        [disabled]="loading"
      ></ion-input>
    </div>

    <div class="form-field">
      <label for="reg-confirm-password">Confirm password</label>
      <ion-input
        id="reg-confirm-password"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Confirm your password"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        [disabled]="loading"
      ></ion-input>
    </div>

    <div class="show-password-toggle mb-5">
      <label class="d-flex align-center gap-2">
        <input type="checkbox" [checked]="showPassword" (change)="togglePassword()" />
        <span class="fs-sm text-secondary">Show password</span>
      </label>
    </div>

    <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="loading">
      <span class="spinner spinner-sm" *ngIf="loading"></span>
      <span *ngIf="!loading">Create Account</span>
      <span *ngIf="loading">Creating account...</span>
    </button>

    <button type="button" class="btn btn-ghost btn-block mt-3" (click)="goBack()">
      Back
    </button>
  </form>

  <!-- Footer -->
  <div class="auth-card__footer">
    <p>Already have an account? <a routerLink="/auth/login">Sign in</a></p>
  </div>
</div>
