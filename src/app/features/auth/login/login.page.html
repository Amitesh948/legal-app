<div class="auth-card">
  <!-- Branding -->
  <div class="auth-card__header">
    <div class="auth-logo">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
        <rect width="44" height="44" rx="10" fill="var(--color-primary)"/>
        <path d="M12 12h6v20h-6V12zm14 6h6v14h-6V18z" fill="white"/>
      </svg>
    </div>
    <h1>Welcome back</h1>
    <p>Sign in to your Legal AI account</p>
  </div>

  <!-- Error Message -->
  <div class="auth-error" *ngIf="errorMessage">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="15" y1="9" x2="9" y2="15"/>
      <line x1="9" y1="9" x2="15" y2="15"/>
    </svg>
    <span>{{ errorMessage }}</span>
  </div>

  <!-- Login Form -->
  <form (ngSubmit)="onSubmit()" novalidate>
    <div class="form-field">
      <label for="email">Email address</label>
      <ion-input
        id="email"
        type="email"
        placeholder="Enter your email"
        [(ngModel)]="email"
        name="email"
        autocomplete="email"
        inputmode="email"
        [disabled]="loading"
      ></ion-input>
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <ion-input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Enter your password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          [disabled]="loading"
        ></ion-input>
        <button
          type="button"
          class="password-toggle"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          <!-- Eye icon -->
          <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- Eye-off icon -->
          <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <button
      type="submit"
      class="btn btn-primary btn-lg btn-block"
      [disabled]="loading"
    >
      <span class="spinner spinner-sm" *ngIf="loading"></span>
      <span *ngIf="!loading">Sign In</span>
      <span *ngIf="loading">Signing in...</span>
    </button>
  </form>

  <!-- Footer -->
  <div class="auth-card__footer">
    <p>Don't have an account? <a routerLink="/auth/register">Create one</a></p>
  </div>
</div>
