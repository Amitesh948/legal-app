<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>AI Summary</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-container p-4">
    <h3 class="mb-1 text-primary">{{ documentName }}</h3>
    <p class="fs-sm text-secondary mb-6">Generated by Gemini AI</p>

    <!-- State: Loading -->
    <div *ngIf="loading">
      <app-skeleton-loader></app-skeleton-loader>
      <app-skeleton-loader class="mt-4"></app-skeleton-loader>
    </div>

    <!-- State: Error -->
    <div *ngIf="!loading && error">
      <app-error-state (retry)="loadData()"></app-error-state>
    </div>

    <!-- State: Data -->
    <div *ngIf="!loading && !error">
      
      <!-- Custom Tab Bar for Modal -->
      <div class="segment-control mb-6">
        <button class="segment-btn" [class.active]="activeTab === 'summary'" (click)="setTab('summary')">Executive Summary</button>
        <button class="segment-btn" [class.active]="activeTab === 'raw'" (click)="setTab('raw')">Extracted Text</button>
      </div>

      <!-- Summary View -->
      <div *ngIf="activeTab === 'summary'">
        <div *ngIf="summary" class="summary-container">
          
          <div class="summary-section mb-6">
            <div class="d-flex j-between align-start mb-3">
              <h4 class="m-0 text-brand fw-bold">Overall Summary</h4>
              <button class="btn btn-sm btn-ghost p-0 text-secondary" (click)="copySummary()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              </button>
            </div>
            <p class="fs-base lh-lg m-0">{{ summary.overall_summary }}</p>
          </div>

          <div class="summary-section mb-6" *ngIf="summary.risk_assessment">
            <h5 class="text-danger fw-bold mb-2">Risk Assessment</h5>
            <p class="fs-sm lh-lg m-0">{{ summary.risk_assessment }}</p>
          </div>

          <div class="summary-section mb-6" *ngIf="summary.legal_issues?.length">
            <h5 class="text-primary fw-bold mb-2">Key Legal Issues</h5>
            <ul class="styled-list">
              <li *ngFor="let issue of summary.legal_issues">{{ issue }}</li>
            </ul>
          </div>

          <div class="summary-section mb-6" *ngIf="summary.important_facts?.length">
            <h5 class="text-primary fw-bold mb-2">Important Facts</h5>
            <ul class="styled-list">
              <li *ngFor="let fact of summary.important_facts">{{ fact }}</li>
            </ul>
          </div>
          
        </div>
        
        <div *ngIf="!summary" class="alert alert--danger">
          Summary generation was not completed successfully.
        </div>
      </div>

      <!-- Raw Text View -->
      <div *ngIf="activeTab === 'raw'">
        <div class="raw-text-container">
          <pre class="m-0 fs-xs text-secondary lh-lg">{{ extractedText }}</pre>
        </div>
      </div>

    </div>
  </div>
</ion-content>
